name: Build and Publish Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore CadenceCisLibraryManager.csproj

    - name: Publish Release (win-x64)
      run: |
        dotnet publish CadenceCisLibraryManager.csproj -c Release -r win-x64 --self-contained false -o ./publish/CadenceCisLibraryManager

    - name: Archive Release
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/CadenceCisLibraryManager/* -DestinationPath ./CadenceCisLibraryManager-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CadenceCisLibraryManager-win-x64
        path: CadenceCisLibraryManager-win-x64.zip
        retention-days: 14

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: CadenceCisLibraryManager-win-x64.zip
        generate_release_notes: true
